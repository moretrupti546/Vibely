<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#3b185f" />
      <stop offset="100%" stop-color="#1e112a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="coverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="discShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#coverBg)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="180" cy="180" r="180" fill="#a855f7" opacity="0.35" filter="url(#coverGlow)" />
  <circle cx="450" cy="420" r="160" fill="#f472b6" opacity="0.25" filter="url(#coverGlow)" />

  <!-- Subtle Concentric Sound Rings -->
  <circle cx="300" cy="260" r="230" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 8" />
  <circle cx="300" cy="260" r="190" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" />
  <circle cx="300" cy="260" r="150" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="4 6" />

  <!-- Modern Vinyl Centerpiece -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="125" fill="#0b0712" stroke="#f472b6" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="125" fill="url(#discShine)" />

    <!-- Vinyl Grooves -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

    <!-- Center Label -->
    <circle cx="0" cy="0" r="50" fill="url(#accentGrad)" filter="url(#coverGlow)" opacity="0.9" />
    <circle cx="0" cy="0" r="46" fill="#1e112a" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="0" cy="0" r="12" fill="#0b0712" stroke="#f472b6" stroke-width="2" />

    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#f472b6" text-anchor="middle" letter-spacing="1">
      ZS
    </text>
  </g>

  <!-- Top Badge: VIBELY MASTER -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#000000" fill-opacity="0.45" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="4.5" fill="#f472b6" />
    <text x="28" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1.5">VIBELY MASTER</text>
  </g>

  <!-- Bottom Details Overlay -->
  <rect y="420" width="600" height="180" fill="url(#coverBg)" opacity="0.9" />
  
  <text x="50" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="0.5">
    Zara Sa
  </text>
  <text x="50" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f472b6" opacity="0.95">
    KK (Krishnakumar Kunnath)
  </text>

  <!-- Audio Waveform Graphic on bottom-right -->
  <g transform="translate(460, 500)" fill="#f472b6" opacity="0.85">
    <rect x="0" y="6" width="4" height="26" rx="2" />
    <rect x="8" y="0" width="4" height="38" rx="2" />
    <rect x="16" y="10" width="4" height="18" rx="2" />
    <rect x="24" y="3" width="4" height="32" rx="2" />
    <rect x="32" y="14" width="4" height="10" rx="2" />
    <rect x="40" y="2" width="4" height="34" rx="2" />
    <rect x="48" y="8" width="4" height="22" rx="2" />
    <rect x="56" y="16" width="4" height="6" rx="2" />
    <rect x="64" y="4" width="4" height="30" rx="2" />
    <rect x="72" y="12" width="4" height="14" rx="2" />
  </g>
</svg>