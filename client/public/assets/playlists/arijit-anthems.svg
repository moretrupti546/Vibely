<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="arijitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#130924" />
      <stop offset="50%" stopColor="#250f4c" />
      <stop offset="100%" stopColor="#080214" />
    </linearGradient>
    <linearGradient id="purpleHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#c084fc" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>
    <filter id="soulGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#arijitBg)" />

  <!-- Ambient Soulful Lights -->
  <circle cx="200" cy="200" r="160" fill="#9333ea" opacity="0.35" filter="url(#soulGlow)" />
  <circle cx="420" cy="300" r="150" fill="#ec4899" opacity="0.25" filter="url(#soulGlow)" />

  <!-- Musical Notes in Background -->
  <g fill="#c084fc" opacity="0.4">
    <!-- Note 1 -->
    <path d="M120,130 L120,95 L145,90 L145,125 A 8 6 0 1 1 130 135 L130,103 L135,103 L135,127 A 8 6 0 1 1 120 130" />
    <!-- Note 2 -->
    <path d="M460,110 L460,80 L480,75 L480,105 A 7 5 0 1 1 470 112 L470,88 L473,88 L473,107 A 7 5 0 1 1 460 110" />
  </g>

  <!-- Acoustic Guitar & Heart Soundwave Center Visual -->
  <g transform="translate(300, 260)">
    <!-- Radiating Acoustic Soundwave Rings -->
    <circle r="170" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 8" />
    <circle r="135" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.3" />
    <circle r="105" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.5" />

    <!-- Acoustic Guitar Silhouette with Glowing Purple Aura -->
    <!-- Guitar Body -->
    <path d="M 0,-50 C 35,-50 55,-25 55,0 C 55,20 38,30 46,65 C 55,105 25,125 0,125 C -25,125 -55,105 -46,65 C -38,30 -55,20 -55,0 C -55,-25 -35,-50 0,-50 Z" fill="#170c2e" stroke="url(#purpleHeart)" stroke-width="3" filter="url(#soulGlow)" />
    <!-- Soundhole -->
    <circle cx="0" cy="15" r="20" fill="#080214" stroke="#c084fc" stroke-width="2" />
    <circle cx="0" cy="15" r="24" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />

    <!-- Guitar Neck & Headstock -->
    <rect x="-4" y="-140" width="8" height="95" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
    <polygon points="-8,-160 8,-160 6,-140 -6,-140" fill="#a855f7" />
    <!-- Tuning Pegs -->
    <circle cx="-12" cy="-155" r="3" fill="#ec4899" />
    <circle cx="-12" cy="-148" r="3" fill="#ec4899" />
    <circle cx="12" cy="-155" r="3" fill="#ec4899" />
    <circle cx="12" cy="-148" r="3" fill="#ec4899" />

    <!-- Soulful Heart Soundwave at base -->
    <path d="M0,85 C-12,70 -30,70 -30,90 C-30,105 0,118 0,118 C0,118 30,105 30,90 C30,70 12,70 0,85 Z" fill="#ec4899" opacity="0.8" filter="url(#soulGlow)" />
  </g>

  <!-- Title Badge -->
  <rect x="40" y="495" width="520" height="70" rx="20" fill="#140924" fill-opacity="0.9" stroke="url(#purpleHeart)" stroke-width="1.5" />
  <text x="70" y="534" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="0.5">ARIJIT SINGH SOULFUL ANTHEMS</text>
  <text x="70" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#c084fc" letter-spacing="1.5">HEARTFELT ACOUSTICS • DEFINITIVE COLLECTION</text>
  <circle cx="510" cy="530" r="16" fill="url(#purpleHeart)" />
  <polygon points="506,522 518,530 506,538" fill="#ffffff" />
</svg>
