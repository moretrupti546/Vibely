<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0b001a" />
      <stop offset="45%" stopColor="#2e0854" />
      <stop offset="65%" stopColor="#791572" />
      <stop offset="85%" stopColor="#f43f5e" />
      <stop offset="100%" stopColor="#fb923c" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="40%" stopColor="#fb7185" />
      <stop offset="100%" stopColor="#e11d48" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#8b5cf6" stopOpacity="0.2" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="380" fill="url(#skyGrad)" />
  <!-- Stars -->
  <circle cx="100" cy="80" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="240" cy="50" r="2" fill="#fff" opacity="0.9" />
  <circle cx="480" cy="90" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="360" cy="110" r="2" fill="#fff" opacity="0.85" />
  <circle cx="180" cy="140" r="1" fill="#fff" opacity="0.6" />
  <circle cx="520" cy="40" r="2" fill="#fff" opacity="0.9" />

  <!-- 80s Retro Sun -->
  <g transform="translate(300, 240)">
    <circle r="120" fill="url(#sunGrad)" filter="url(#neon)" />
    <!-- Sun Horizontal Blinds Cutouts -->
    <rect x="-130" y="10" width="260" height="4" fill="#1b0333" />
    <rect x="-130" y="24" width="260" height="6" fill="#1b0333" />
    <rect x="-130" y="40" width="260" height="9" fill="#1b0333" />
    <rect x="-130" y="60" width="260" height="12" fill="#1b0333" />
    <rect x="-130" y="82" width="260" height="16" fill="#1b0333" />
  </g>

  <!-- Mountain Silhouettes -->
  <polygon points="0,380 90,300 170,350 250,290 330,360 410,280 490,340 600,270 600,380" fill="#150228" opacity="0.95" />
  <polygon points="0,380 120,330 200,360 300,310 400,370 520,320 600,350 600,380" fill="#0d011a" />

  <!-- Neon Grid Ground (Perspective) -->
  <rect y="380" width="600" height="220" fill="#0a0014" />
  <!-- Grid Horizon Line -->
  <line x1="0" y1="380" x2="600" y2="380" stroke="#06b6d4" stroke-width="2.5" filter="url(#neon)" />
  
  <!-- Perspective Lines -->
  <line x1="300" y1="380" x2="300" y2="600" stroke="#ec4899" stroke-width="1.5" opacity="0.7" />
  <line x1="300" y1="380" x2="160" y2="600" stroke="#ec4899" stroke-width="1.5" opacity="0.7" />
  <line x1="300" y1="380" x2="440" y2="600" stroke="#ec4899" stroke-width="1.5" opacity="0.7" />
  <line x1="300" y1="380" x2="10" y2="600" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />
  <line x1="300" y1="380" x2="590" y2="600" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />
  <line x1="300" y1="380" x2="-140" y2="600" stroke="#06b6d4" stroke-width="1.5" opacity="0.5" />
  <line x1="300" y1="380" x2="740" y2="600" stroke="#06b6d4" stroke-width="1.5" opacity="0.5" />

  <!-- Horizontal Grid Lines -->
  <line x1="0" y1="392" x2="600" y2="392" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="0" y1="410" x2="600" y2="410" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" />
  <line x1="0" y1="435" x2="600" y2="435" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />
  <line x1="0" y1="470" x2="600" y2="470" stroke="#ec4899" stroke-width="1.8" opacity="0.8" />
  <line x1="0" y1="520" x2="600" y2="520" stroke="#ec4899" stroke-width="2" opacity="0.9" />

  <!-- Title Overlay Badge -->
  <rect x="40" y="495" width="520" height="70" rx="20" fill="#0d001a" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
  <text x="70" y="534" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="0.5">LATE NIGHT SYNTHWAVE</text>
  <text x="70" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#06b6d4" letter-spacing="1.5">NEON LIGHTS • 80S RETRO CYBERPUNK</text>
  <circle cx="510" cy="530" r="16" fill="#ec4899" />
  <polygon points="506,522 518,530 506,538" fill="#ffffff" />
</svg>
