<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="romanceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#250a26" />
      <stop offset="50%" stopColor="#3b0735" />
      <stop offset="100%" stopColor="#120214" />
    </linearGradient>
    <linearGradient id="pinkViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="50%" stopColor="#ec4899" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <filter id="romanceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#romanceBg)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="200" r="160" fill="#ec4899" opacity="0.35" filter="url(#romanceGlow)" />
  <circle cx="420" cy="320" r="150" fill="#a855f7" opacity="0.3" filter="url(#romanceGlow)" />

  <!-- Center Double Heart Nebula Rhythm -->
  <g transform="translate(300, 260)">
    <!-- Expanding Soundwave Rings -->
    <circle r="180" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 8" />
    <circle r="140" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.3" />
    <circle r="105" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.45" />

    <!-- Big Center Heart -->
    <path d="M 0,-30 C -50,-80 -120,-40 -120,30 C -120,95 -30,135 0,165 C 30,135 120,95 120,30 C 120,-40 50,-80 0,-30 Z" fill="#2d0b30" stroke="url(#pinkViolet)" stroke-width="4" filter="url(#romanceGlow)" />
    
    <!-- Inner Glowing Heart -->
    <path d="M 0,0 C -35,-40 -80,-10 -80,40 C -80,85 -20,115 0,135 C 20,115 80,85 80,40 C 80,-10 35,-40 0,0 Z" fill="url(#pinkViolet)" opacity="0.85" />
    
    <!-- Center Music Wave Cutout -->
    <rect x="-35" y="30" width="6" height="30" rx="3" fill="#ffffff" />
    <rect x="-20" y="15" width="6" height="45" rx="3" fill="#ffffff" />
    <rect x="-5" y="5" width="6" height="55" rx="3" fill="#ffffff" />
    <rect x="10" y="20" width="6" height="40" rx="3" fill="#ffffff" />
    <rect x="25" y="32" width="6" height="26" rx="3" fill="#ffffff" />
  </g>

  <!-- Title Badge -->
  <rect x="40" y="495" width="520" height="70" rx="20" fill="#1f0622" fill-opacity="0.9" stroke="url(#pinkViolet)" stroke-width="1.5" />
  <text x="70" y="534" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="0.5">BOLLYWOOD ROMANCE</text>
  <text x="70" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#f472b6" letter-spacing="1.5">DIL KI BAATEIN • SOUL-STIRRING BALLADS</text>
  <circle cx="510" cy="530" r="16" fill="url(#pinkViolet)" />
  <polygon points="506,522 518,530 506,538" fill="#ffffff" />
</svg>
