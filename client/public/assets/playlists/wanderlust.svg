<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wanderSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#081026" />
      <stop offset="50%" stopColor="#1e1b4b" />
      <stop offset="80%" stopColor="#312e81" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1e1e2f" />
      <stop offset="100%" stopColor="#0f0f17" />
    </linearGradient>
    <linearGradient id="wanderAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="420" fill="url(#wanderSky)" />

  <!-- Moon with Glow -->
  <circle cx="480" cy="120" r="50" fill="#fef3c7" filter="url(#softGlow)" opacity="0.9" />
  <circle cx="480" cy="120" r="45" fill="#fef9c3" />
  <circle cx="465" cy="110" r="42" fill="url(#wanderSky)" />

  <!-- Stars -->
  <circle cx="80" cy="70" r="1.5" fill="#fff" opacity="0.9" />
  <circle cx="150" cy="120" r="2" fill="#fff" opacity="0.8" />
  <circle cx="240" cy="60" r="1.5" fill="#fff" opacity="0.85" />
  <circle cx="340" cy="100" r="2" fill="#fff" opacity="0.9" />
  <circle cx="210" cy="160" r="1" fill="#fff" opacity="0.6" />
  <circle cx="400" cy="50" r="1.5" fill="#fff" opacity="0.75" />

  <!-- Mountain Ranges -->
  <polygon points="0,420 100,220 220,320 340,190 440,300 540,240 600,290 600,420" fill="#1e1b4b" opacity="0.9" />
  <!-- Snow Peaks -->
  <polygon points="100,220 75,260 125,260" fill="#e0e7ff" opacity="0.4" />
  <polygon points="340,190 310,240 370,240" fill="#e0e7ff" opacity="0.4" />
  <polygon points="540,240 515,280 565,280" fill="#e0e7ff" opacity="0.4" />

  <!-- Closer Dark Hills -->
  <polygon points="0,420 80,330 180,380 280,310 390,370 500,320 600,360 600,420" fill="#0f172a" />

  <!-- Highway Ground -->
  <rect y="420" width="600" height="180" fill="#080c14" />
  <!-- Winding Road -->
  <polygon points="285,420 315,420 480,600 120,600" fill="url(#roadGrad)" stroke="#334155" stroke-width="1" />
  <!-- Road Center Dashed Line -->
  <line x1="300" y1="420" x2="300" y2="600" stroke="#fbbf24" stroke-width="4" stroke-dasharray="14 16" />

  <!-- Acoustic Guitar Silhouette in Center Sky -->
  <g transform="translate(300, 260) scale(0.65)" opacity="0.75">
    <ellipse cx="0" cy="40" rx="42" ry="52" fill="#818cf8" filter="url(#softGlow)" opacity="0.3" />
    <circle cx="0" cy="10" r="16" fill="#0f172a" />
    <path d="M-2 -80 L2 -80 L2 20 L-2 20 Z" fill="#c7d2fe" />
    <path d="M-12 -80 L12 -80 L12 -65 L-12 -65 Z" fill="#c7d2fe" />
  </g>

  <!-- Title Badge -->
  <rect x="40" y="495" width="520" height="70" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
  <text x="70" y="534" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="0.5">WANDERLUST: ROAD TRIPS</text>
  <text x="70" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#818cf8" letter-spacing="1.5">HIGHWAY WINDS • ACOUSTIC FREEDOM</text>
  <circle cx="510" cy="530" r="16" fill="url(#wanderAmber)" />
  <polygon points="506,522 518,530 506,538" fill="#0f172a" />
</svg>
