<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="defaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#140b28" />
      <stop offset="50%" stopColor="#241042" />
      <stop offset="100%" stopColor="#0a0515" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a855f7" />
      <stop offset="50%" stopColor="#ec4899" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <filter id="defaultGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#defaultBg)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="200" r="160" fill="#a855f7" opacity="0.35" filter="url(#defaultGlow)" />
  <circle cx="420" cy="380" r="150" fill="#ec4899" opacity="0.3" filter="url(#defaultGlow)" />

  <!-- Center Vinyl Disc -->
  <g transform="translate(300, 270)">
    <circle r="130" fill="#130c22" stroke="url(#brandGrad)" stroke-width="4" filter="url(#defaultGlow)" />
    <circle r="115" fill="none" stroke="#6b21a8" stroke-width="1" stroke-opacity="0.4" />
    <circle r="100" fill="none" stroke="#6b21a8" stroke-width="1" stroke-opacity="0.35" />
    <circle r="85" fill="none" stroke="#6b21a8" stroke-width="1" stroke-opacity="0.3" />
    <circle r="70" fill="none" stroke="#6b21a8" stroke-width="1" stroke-opacity="0.4" />
    <circle r="50" fill="url(#brandGrad)" />
    <circle r="16" fill="#0d0718" stroke="#f472b6" stroke-width="2" />
    <polygon points="0,-32 8,-12 28,-12 12,0 18,20 0,8 -18,20 -12,0 -28,-12 -8,-12" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Title Badge -->
  <rect x="40" y="495" width="520" height="70" rx="20" fill="#150a26" fill-opacity="0.9" stroke="url(#brandGrad)" stroke-width="1.5" />
  <text x="70" y="534" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="0.5">VIBELY CURATED PLAYLIST</text>
  <text x="70" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#c084fc" letter-spacing="1.5">OFFICIAL SOUNDTRACK • FEEL EVERY BEAT</text>
  <circle cx="510" cy="530" r="16" fill="url(#brandGrad)" />
  <polygon points="506,522 518,530 506,538" fill="#ffffff" />
</svg>
