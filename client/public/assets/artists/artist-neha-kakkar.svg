<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="200" r="160" fill="#f59e0b" opacity="0.3" filter="url(#glow)" />
  <circle cx="120" cy="120" r="90" fill="#fcd34d" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Concentric Aura Rings -->
  <circle cx="250" cy="230" r="190" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 6" />
  <circle cx="250" cy="230" r="165" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="250" cy="230" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Stylized Artist Crest / Monogram Container -->
  <circle cx="250" cy="215" r="95" fill="#451a03" stroke="url(#ringGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Equalizer Pulse Arc on top of crest -->
  <path d="M 180 215 A 70 70 0 0 1 320 215" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Initials Monogram -->
  <text x="250" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">
    NK
  </text>

  <!-- Sound Waves under Monogram -->
  <g transform="translate(205, 260)" fill="#fcd34d" opacity="0.9">
    <rect x="0" y="4" width="4" height="12" rx="2" />
    <rect x="10" y="0" width="4" height="20" rx="2" />
    <rect x="20" y="6" width="4" height="10" rx="2" />
    <rect x="30" y="2" width="4" height="16" rx="2" />
    <rect x="40" y="8" width="4" height="8" rx="2" />
    <rect x="50" y="0" width="4" height="20" rx="2" />
    <rect x="60" y="5" width="4" height="11" rx="2" />
    <rect x="70" y="3" width="4" height="15" rx="2" />
    <rect x="80" y="7" width="4" height="7" rx="2" />
  </g>

  <!-- Bottom Dark Vignette for Typography -->
  <rect y="350" width="500" height="150" fill="url(#bgGrad)" opacity="0.9" />

  <!-- Artist Name Display -->
  <text x="250" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">
    Neha Kakkar
  </text>

  <!-- Verified Badge -->
  <g transform="translate(195, 430)">
    <rect x="0" y="0" width="110" height="24" rx="12" fill="#9a3412" stroke="#fcd34d" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="12" r="5" fill="#fcd34d" />
    <text x="30" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">VERIFIED</text>
  </g>
</svg>